name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Java 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supplytracker1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supplytracker-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: supplytracker-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  python:
    name: Inference service / Python 3.11
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yolov3-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: yolov3-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py tests
      - run: python -m unittest discover -s tests -v

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local stack
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate production stack
        env:
          JWT_SECRET: ci-only-secret-not-used-for-deployment-123456
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
        run: docker compose -f docker-compose.prod.yml config --quiet
